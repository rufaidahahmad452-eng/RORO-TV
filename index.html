<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RORO TV</title>

    <!-- CSS -->
    <link rel="stylesheet" href="roro.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>


    <!-- ==========================================
                    HEADER
    =========================================== -->

    <header>

        <nav>

            <!-- Logo -->
            <div class="logo">
                <h1>🎬 RORO TV</h1>
            </div>


            <!-- Navigation Links -->
            <ul class="nav-links">
                <li><a href="#" id="homeLink">Home</a></li>
                <li><a href="tv-shows.html" id="tvShowsLink">TV Shows</a></li>
                <li><a href="movie.html" id="moviesLink">Movies</a></li>
                <li><a href="Mylist.html">My List</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

            <!-- Navigation Icons -->
            <div class="nav-icons">
                <a href="#" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></a>
                <div class="search-box"><input type="text" id="searchInput" placeholder="Search movies..."></div>
                <!--Notification -->
                <a href="#" id="notificationBtn">
                    <i class="fa-regular fa-bell"></i>
                    <span class="notification-count">3</span>
                </a>
                <div class="notification-box">
                    <h4>🔔 Notifications</h4>
                    <div class="notification-list"></div>
                </div>
                <!-- Login -->
                <a href="#" id="loginBtn"><i class="fa-regular fa-circle-user"></i></a>
                <!-- LogOut -->
                <button class="logout-btn" id="logoutBtn">LogOut</button>

            </div>

        </nav>

    </header>

    <main>

        <!-- ==========================================
                    HERO SECTION
        =========================================== -->

        <section class="hero">

            <!-- Hero Text -->
            <div class="hero-text">

                <h2>Track Every Show You Love</h2>

                <p>
                    Keep track of TV shows and movies,
                    create watchlists and discover new favorites.
                </p>

                <!-- Hero Buttons -->
                <div class="hero-buttons">

                    <button class="btn-primary" id="startBtn">
                        <i class="fa-solid fa-play"></i>
                        Start Watching
                    </button>

                    <button id="myListBtn" class="btn-secondary">
                        <i class="btn-icon fa-solid fa-plus"></i>
                        <span class="btn-text">My List</span>
                    </button>

                </div>

            </div>

            <!-- Hero Image -->
            <div class="hero-image">
                <img src="tv.jpeg" alt="Movie Poster">
            </div>

        </section>

        <!-- ==========================================
                TRENDING SECTION
        =========================================== -->

        <section class="trending" id="trending">

            <h2>🔥 Trending Now</h2>

            <div class="cards" id="movieCards">

                <!-- Card 1 -->
                <div class="card"> </div>

                <!-- Card 2 -->
                <div class="card"></div>

                <!-- Card 3 -->
                <div class="card"></div>

                <!-- Card 4 -->
                <div class="card"></div>

            </div>

        </section>

    </main>


    <!-- ==========================================
                LOGIN POPUP
========================================== -->

    <div class="login-popup" id="loginPopup">

        <div class="login-content">

            <span class="close-btn" id="closeBtn">&times;</span>

            <h2>Login</h2>

            <input type="text" id="username" placeholder="Username">

            <input type="password" id="password" placeholder="Password">
            <label class="remember">
                <input type="checkbox" id="rememberMe">Remember Me
            </label>
            <p class="login-message" id="loginMessage"></p>

            <button class="btn-primary" id="loginSubmit">Login</button>

        </div>

    </div>


    <!-- ==========================================
                    FOOTER
    =========================================== -->

    <footer>

        <p>© 2026 RORO TV | Made with ❤️ by Roro</p>

    </footer>


    <!-- JS -->
    <script src="roro.js"></script>

</body>

</html>
